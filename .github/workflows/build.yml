# Native, self-contained packages (without AI separation) for Windows, Linux and macOS (Intel + Apple Silicon).
# Push a tag like v1.0.0 (or start the workflow by hand); the packages appear as build artifacts / release files.
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux-x86_64
          - os: macos-14
            name: macOS-AppleSilicon
          - os: macos-15-intel
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libxcb-cursor0 libegl1
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --onedir --name Mixsmith \
            --icon logo.png --add-data "logo.png:." --add-data "logo.ico:." --add-data "README.md:." --add-data "LICENSE:." --add-data "LIZENZEN.md:." --add-data "profiles:profiles" \
            --collect-all soundfile --collect-all sounddevice --collect-all pedalboard --hidden-import pyloudnorm --hidden-import mix_core \
            --exclude-module torch --exclude-module audio_separator --exclude-module tkinter mixsmith.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Mixsmith -DestinationPath Mixsmith-${{ github.ref_name }}-${{ matrix.name }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf Mixsmith-${{ github.ref_name }}-${{ matrix.name }}.tar.gz -C dist Mixsmith
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: hdiutil create -volname Mixsmith -srcfolder dist/Mixsmith.app -ov -format UDZO Mixsmith-${{ github.ref_name }}-${{ matrix.name }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Mixsmith-${{ matrix.name }}
          path: Mixsmith-*.*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Mixsmith-*.*
