# Installers (without AI separation) in Kieselwerk style for Windows, Linux and macOS (Intel + Apple Silicon).
# Push a tag like v1.0.1 (or start the workflow by hand); the files appear as build artifacts and, for tags, as release files.
#   Windows: Mixsmith-<ver>-Windows-Setup.exe   (Inno Setup, wizard pictures in packaging/windows)
#   macOS:   Mixsmith-<ver>-macOS-<arch>.dmg    (drag-to-Applications window, background in packaging/macos)
#   Linux:   Mixsmith-<ver>-Linux-x86_64.AppImage
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux-x86_64
          - os: macos-14
            name: macOS-AppleSilicon
          - os: macos-15-intel
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        shell: bash
        run: echo "VER=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' audio_core.py)" >> "$GITHUB_ENV"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libxcb-cursor0 libegl1 libfuse2
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: PyInstaller
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          ICON=logo.png; [ "$RUNNER_OS" = "Windows" ] && ICON=logo.ico
          pyinstaller --noconfirm --windowed --onedir --name Mixsmith --icon "$ICON" --distpath dist_setup \
            --add-data "logo.png${SEP}." --add-data "logo.ico${SEP}." --add-data "README.md${SEP}." --add-data "LICENSE${SEP}." --add-data "LIZENZEN.md${SEP}." \
            --add-data "profiles${SEP}profiles" --add-data "tutorial/Mixsmith-Tutorial.mp4${SEP}tutorial" --add-data "tutorial/Mixsmith-Tutorial.json${SEP}tutorial" \
            --collect-all soundfile --collect-all sounddevice --collect-all pedalboard --hidden-import pyloudnorm --hidden-import mix_core \
            --exclude-module torch --exclude-module audio_separator --exclude-module tkinter mixsmith.py
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VER" packaging\windows\setup_windows.iss
          Move-Item "installer\Mixsmith-$env:VER-Windows-Setup.exe" .
      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          APP=Mixsmith.AppDir
          mkdir -p $APP/usr/bin $APP/usr/share/icons/hicolor/256x256/apps
          cp -r dist_setup/Mixsmith/. $APP/usr/bin/
          cp packaging/linux/mixsmith.desktop $APP/
          python -c "from PIL import Image; Image.open('logo_1024.png').resize((256,256)).save('$APP/mixsmith.png')"
          cp $APP/mixsmith.png $APP/usr/share/icons/hicolor/256x256/apps/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/Mixsmith" "$@"\n' > $APP/AppRun
          chmod +x $APP/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run $APP "Mixsmith-$VER-Linux-x86_64.AppImage"
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          tiffutil -cathidpicheck packaging/macos/dmg_background.png "packaging/macos/dmg_background@2x.png" -out dmg_background.tiff
          create-dmg --volname "Mixsmith" --background dmg_background.tiff --window-pos 200 120 --window-size 660 400 \
            --icon-size 96 --text-size 13 --icon "Mixsmith.app" 165 205 --hide-extension "Mixsmith.app" --app-drop-link 495 205 \
            --no-internet-enable "Mixsmith-$VER-${{ matrix.name }}.dmg" dist_setup/Mixsmith.app
      - uses: actions/upload-artifact@v4
        with:
          name: Mixsmith-${{ matrix.name }}
          path: |
            Mixsmith-*.exe
            Mixsmith-*.dmg
            Mixsmith-*.AppImage
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Mixsmith-*.exe
            Mixsmith-*.dmg
            Mixsmith-*.AppImage
